<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>منصة مدار المدرسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: right-hand navigation rail (RTL) + working canvas; cards only for discrete objects, tables for records */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#EAF0F6; --line:#D9E2EC;
  --fg:#132233; --muted:#5A6B7E; --brand:#16467A; --brand-2:#E3EDF8; --on-brand:#FFFFFF;
  --accent:#0E8F72; --accent-2:#DDF3EC;
  --good:#1D8752; --good-bg:#E1F4E9; --warn:#A86F00; --warn-bg:#FBF0D6; --bad:#BC3B33; --bad-bg:#FBE4E1; --info:#2464A8; --info-bg:#E2EDF9;
  --shadow:0 1px 2px rgba(19,34,51,.06),0 6px 20px rgba(19,34,51,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --surface:#141E29; --surface-2:#1A2633; --line:#263546;
  --fg:#E5ECF3; --muted:#91A2B5; --brand:#6EA6E0; --brand-2:#1B2D42; --on-brand:#0D141C;
  --accent:#3CC9A2; --accent-2:#123228;
  --good:#4CC488; --good-bg:#12301F; --warn:#E3B04B; --warn-bg:#33270C; --bad:#F07A70; --bad-bg:#3A1714; --info:#78AEEA; --info-bg:#16283D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#141E29; --surface-2:#1A2633; --line:#263546;
  --fg:#E5ECF3; --muted:#91A2B5; --brand:#6EA6E0; --brand-2:#1B2D42; --on-brand:#0D141C;
  --accent:#3CC9A2; --accent-2:#123228;
  --good:#4CC488; --good-bg:#12301F; --warn:#E3B04B; --warn-bg:#33270C; --bad:#F07A70; --bad-bg:#3A1714; --info:#78AEEA; --info-bg:#16283D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.65}
#app,#modal,#toast{direction:rtl}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn .ic{width:17px;height:17px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
label.f{display:grid;gap:5px;font-weight:600;font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:400}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-2);border-color:var(--brand)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form{display:grid;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-weight:500;cursor:pointer}

/* shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:18px}
.brand{display:flex;gap:10px;align-items:center;padding-inline:18px;margin-bottom:18px}
.brand b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.side nav{display:grid;gap:2px;padding-inline:10px;overflow:auto;flex:1}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--brand-2);color:var(--brand);font-weight:700}
.nav span{flex:1}
.cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding-inline:6px;font-weight:700}
.side-foot{border-top:1px solid var(--line);padding:14px 18px 0;display:grid;gap:10px}
.me{display:flex;gap:10px;align-items:center;min-width:0}
.me b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--muted);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display);font-size:14px;background:var(--brand-2);color:var(--brand)}
.av.sm{width:28px;height:28px;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px)}
.top .when{color:var(--muted);font-size:13px}
.top .grow{flex:1;min-width:0}
.top h2{font-size:17px}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.iconbtn .cnt{position:absolute;top:-6px;left:-6px}
.menu-btn{display:none}
.content{padding:24px clamp(16px,3vw,32px) 48px;display:grid;gap:22px;align-content:start}
.scrim{display:none}
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;right:0;width:270px;z-index:30;transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  .menu-btn{display:grid}
}

/* page pieces */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
.phead h1{font-size:24px}
.phead p{margin:2px 0 0;color:var(--muted)}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.stat .k{color:var(--muted);font-size:12.5px;font-weight:600}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted)}
.stat.good .v{color:var(--good)} .stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h3{font-size:15.5px}
.panel>.body{padding:14px 16px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.cols.c2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1100px){.cols.c2{grid-template-columns:minmax(0,1fr)}}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t small{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td input[type=number]{width:70px;padding:5px 6px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools>*{flex:0 1 auto}
.tools input[type=search]{max-width:260px}
.tools select{width:auto;min-width:180px}

/* cards grid for lessons etc */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .sub{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.card h4{font-size:16px}
.card p{margin:0;color:var(--muted);font-size:13px}
.card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px dashed var(--line);flex-wrap:wrap}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar-row .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px}
.bt i.good{background:var(--good)} .bt i.info{background:var(--info)} .bt i.warn{background:var(--warn)} .bt i.bad{background:var(--bad)}
.bv{font-variant-numeric:tabular-nums;font-weight:700;text-align:end}
.spark{width:100%;height:auto;display:block}
.spark text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}

/* timetable */
.tt th,.tt td{text-align:center;border:1px solid var(--line)}
.tt td{min-width:110px;padding:6px}
.slot{border-radius:7px;padding:6px 4px;font-size:12.5px;font-weight:600;line-height:1.35}
.slot small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.tt td.now{outline:2px solid var(--accent);outline-offset:-2px}
.tt select{font-size:12px;padding:4px}

/* attendance segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:5px 11px;font-size:12.5px;font-weight:700;border-inline-start:1px solid var(--line)}
.seg label:first-child span{border-inline-start:0}
.seg input:checked+span.p{background:var(--good-bg);color:var(--good)}
.seg input:checked+span.a{background:var(--bad-bg);color:var(--bad)}
.seg input:checked+span.l{background:var(--warn-bg);color:var(--warn)}
.seg input:checked+span.e{background:var(--info-bg);color:var(--info)}
.seg input:focus-visible+span{outline:2px solid var(--brand)}
.heat{display:flex;flex-wrap:wrap;gap:4px}
.heat i{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700}
.heat i.p{background:var(--good-bg);color:var(--good)} .heat i.a{background:var(--bad);color:#fff} .heat i.l{background:var(--warn-bg);color:var(--warn)} .heat i.e{background:var(--info-bg);color:var(--info)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* lesson reader */
.reader{display:grid;gap:12px}
.reader h4{font-size:16px;margin-top:6px}
.reader p{margin:0}
.reader ul{margin:0;padding-inline-start:20px}
.reader .box{background:var(--surface-2);border-radius:8px;padding:10px 14px}
.attach{display:flex;flex-wrap:wrap;gap:8px}
.attach span,.attach a{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px;color:var(--fg);text-decoration:none;font-weight:600}
.attach a{background:var(--accent-2);border-color:transparent;color:var(--accent)}
.thread{display:grid;gap:10px}
.cmt{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.cmt.t{background:var(--brand-2)}
.cmt b{font-size:13px} .cmt small{color:var(--muted);font-size:11.5px;margin-inline-start:6px}
.cmt p{margin:2px 0 0}

/* messages */
.msgs{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:520px}
.contacts{border-inline-end:1px solid var(--line);overflow:auto;max-height:640px}
.contact{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:11px 14px;cursor:pointer;text-align:start;border-bottom:1px solid var(--line)}
.contact:hover{background:var(--surface-2)}
.contact.on{background:var(--brand-2)}
.contact .t{flex:1;min-width:0}
.contact b{display:block;font-size:13.5px}
.contact small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo{display:flex;flex-direction:column;min-width:0}
.convo .stream{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:520px}
.bub{max-width:75%;padding:8px 12px;border-radius:12px;background:var(--surface-2);align-self:flex-start}
.bub.mine{background:var(--brand);color:var(--on-brand);align-self:flex-end}
.bub small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.convo form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.convo form input{flex:1}
@media (max-width:760px){.msgs{grid-template-columns:minmax(0,1fr)}.contacts{max-height:240px;border-inline-end:0;border-bottom:1px solid var(--line)}}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.qcard h4{font-size:15.5px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-2)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.timer{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.qb{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.qb .row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11.5px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:4px}
.cal .d{min-height:62px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px;background:var(--surface);overflow:hidden}
.cal .d.off{background:var(--surface-2);color:var(--muted)}
.cal .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .ev{display:block;font-size:10.5px;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.exam{background:var(--bad-bg);color:var(--bad)} .ev.meeting{background:var(--info-bg);color:var(--info)} .ev.holiday{background:var(--good-bg);color:var(--good)} .ev.activity{background:var(--warn-bg);color:var(--warn)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,18,28,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-box header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal-box header h3{font-size:17px}
.modal-body{padding:18px;overflow:auto}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.login-hero{background:var(--brand);color:var(--on-brand);padding:48px clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:18px;justify-content:center;position:relative;overflow:hidden}
.login-hero h1{font-size:clamp(40px,6vw,64px);font-weight:700;letter-spacing:-.5px}
.login-hero p{font-size:16.5px;max-width:30em;margin:0;opacity:.92}
.login-hero .facts{display:grid;gap:8px;font-size:13.5px;opacity:.9}
.login-hero .facts div{display:flex;gap:8px;align-items:center}
.login-hero .grid-bg{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(currentColor 1px,transparent 1px),linear-gradient(90deg,currentColor 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.login-main{padding:40px clamp(16px,4vw,48px);display:grid;gap:18px;align-content:center}
.login-main h2{font-size:22px}
.login-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.role-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.role-card h3{font-size:17px}
.role-card p{margin:0;color:var(--muted);font-size:13px;min-height:3.2em}
.role-ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--brand-2);color:var(--brand)}
.note{color:var(--muted);font-size:13px;margin:0}
@media (max-width:860px){.login{grid-template-columns:minmax(0,1fr)}.login-hero{padding-block:32px}}

/* ================= v2: motion ================= */
body{background-image:radial-gradient(color-mix(in srgb,var(--line) 75%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
input[type=time]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=range]{width:100%;accent-color:var(--brand)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes floaty{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-22px) rotate(12deg)}}
@keyframes reveal{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes ring{0%,86%,100%{transform:rotate(0)}88%{transform:rotate(16deg)}90%{transform:rotate(-14deg)}92%{transform:rotate(10deg)}94%{transform:rotate(-6deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes pulseRing{from{transform:scale(.6);opacity:.4}to{transform:scale(1.7);opacity:0}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-50px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(50px) scale(.98)}to{opacity:1;transform:none}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes deal{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-34px,-12px) rotate(-9deg)}}
@keyframes deal2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(30px,-6px) rotate(7deg)}}
@keyframes lit{0%,4%{opacity:.35}8%,28%{opacity:1;color:var(--accent)}34%,100%{opacity:.35}}
@keyframes fanIn{from{opacity:0;transform:translateY(40px) rotate(0)}to{opacity:1;transform:rotate(var(--r))}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.enter .content>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.enter .cards>*,.enter .stats>*,.enter .badges>*,.enter .thumbs>*{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.enter .cards>*:nth-child(2),.enter .stats>*:nth-child(2),.enter .badges>*:nth-child(2),.enter .thumbs>*:nth-child(2){animation-delay:.07s}
.enter .cards>*:nth-child(3),.enter .stats>*:nth-child(3),.enter .badges>*:nth-child(3),.enter .thumbs>*:nth-child(3){animation-delay:.14s}
.enter .cards>*:nth-child(4),.enter .stats>*:nth-child(4),.enter .badges>*:nth-child(4),.enter .thumbs>*:nth-child(4){animation-delay:.21s}
.enter .cards>*:nth-child(5),.enter .stats>*:nth-child(5),.enter .badges>*:nth-child(5),.enter .thumbs>*:nth-child(5){animation-delay:.28s}
.enter .cards>*:nth-child(n+6),.enter .badges>*:nth-child(n+6),.enter .thumbs>*:nth-child(n+6){animation-delay:.35s}
.enter .bt i{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) .25s both;transform-origin:right center}
.enter .meter i{animation:grow 1s cubic-bezier(.2,.8,.2,1) .3s both;transform-origin:right center}
.card,.stat,.role-card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card:hover,.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.nav{position:relative;transition:background .2s,color .2s}
.nav::before{content:"";position:absolute;inset-inline-start:-10px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--brand);transform:scaleY(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.nav.on::before{transform:scaleY(1)}
.nav .ic{transition:transform .25s}
.nav:hover .ic{transform:scale(1.15) rotate(-8deg)}
.brand .logo .ic{animation:swing 4s ease-in-out infinite;transform-origin:50% 30%}
.iconbtn.ring>.ic{animation:ring 3.2s infinite;transform-origin:50% 10%}
.btn{transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.primary:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn[disabled]{opacity:.45;pointer-events:none}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1.4s infinite}
.btn.pulse{animation:pulse 1.6s infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* login */
.floaters{position:absolute;inset:0;pointer-events:none}
.floaters span{position:absolute;left:var(--x);top:var(--y);opacity:.2;animation:floaty var(--t) ease-in-out var(--d) infinite}
.floaters .ic{width:46px;height:46px;stroke-width:1.3}
.orbit{position:relative;width:60px;height:60px;display:grid;place-items:center}
.orbit::after{content:"";position:absolute;inset:-9px;border:2px dashed currentColor;border-radius:50%;opacity:.35;animation:orbit 14s linear infinite}
.orbit::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:currentColor;top:-13px;left:50%;transform-origin:0 43px;animation:orbit 6s linear infinite;opacity:.8}
.chalk{font-family:var(--f-display);font-size:clamp(18px,2.2vw,24px);display:inline-grid;justify-self:start}
.chalk span{animation:reveal 2s steps(24) .3s both}
.chalk::after{content:"";height:3px;background:currentColor;border-radius:3px;opacity:.55;margin-top:4px;transform-origin:right;animation:grow 1s cubic-bezier(.2,.8,.2,1) 2.3s both}
.login-hero>*:not(.grid-bg):not(.floaters){position:relative;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.login-hero h1{animation-delay:.1s!important}
.role-card{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.2s + var(--i,0)*90ms)}
.role-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--brand)}
.role-card:hover .role-ic{animation:swing .7s}
.newbadge{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.16);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}

/* bell bar */
.bellbar{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;min-width:0;max-width:300px}
.bellbar>.ic{color:var(--accent)}
.bellbar b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-track{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;width:160px;max-width:100%;margin-top:3px}
.bb-track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1s}
.bellbar.break .bb-track i{background:var(--warn)}
.bellbar.off>.ic{color:var(--muted)}
.livepill{border:0;cursor:pointer}
@media (max-width:760px){.bellbar{display:none}}

/* slides */
.slide{aspect-ratio:16/9;width:100%;container-type:inline-size;position:relative;overflow:hidden;border-radius:10px;background:#FFFFFF;color:#1E2B3A;border:1px solid var(--line);font-family:var(--f-body);text-align:start}
.slide h2,.slide h3{font-family:var(--f-display);color:inherit;margin:0}
.s-cover{background:var(--h);color:#FFFFFF;display:grid;align-items:center;border-color:transparent}
.s-cover .s-in{padding:0 8cqi;display:grid;gap:1.6cqi;position:relative;z-index:1}
.s-cover h2{font-size:6cqi;line-height:1.2}
.s-cover p{margin:0;font-size:2.4cqi;opacity:.92}
.s-cover small{font-size:1.7cqi;opacity:.85}
.s-tag{justify-self:start;background:rgba(255,255,255,.2);padding:.5cqi 1.6cqi;border-radius:99px;font-size:1.8cqi;font-weight:700}
.s-cover>i{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.s-cover .c1{width:40cqi;height:40cqi;left:-12cqi;top:-14cqi}
.s-cover .c2{width:22cqi;height:22cqi;left:22cqi;bottom:-12cqi}
.s-cover .c3{width:9cqi;height:9cqi;left:8cqi;bottom:12cqi;background:rgba(255,255,255,.22)}
.slide:not(.s-cover){padding:4.5cqi 6cqi 8cqi;display:flex;flex-direction:column;gap:2.2cqi;border-inline-start:1.4cqi solid var(--h)}
.s-head{display:grid;gap:.6cqi}
.s-kind{display:inline-flex;align-items:center;gap:.8cqi;color:var(--h);font-weight:700;font-size:1.8cqi}
.s-kind .ic{width:2.4cqi;height:2.4cqi}
.s-head h3{font-size:3.8cqi;line-height:1.25;padding-bottom:1cqi;border-bottom:.35cqi solid color-mix(in srgb,var(--h) 30%,transparent)}
.slide ul{margin:0;padding:0;list-style:none;display:grid;gap:1.3cqi;font-size:2.35cqi;line-height:1.5;position:relative;z-index:1}
.slide.dense ul{font-size:1.8cqi;gap:.7cqi}
.slide li{position:relative;padding-inline-start:3cqi}
.slide li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:1.2cqi;height:1.2cqi;border-radius:50%;background:var(--h);transform:translateY(-50%)}
.s-example li,.s-quiz li{background:color-mix(in srgb,var(--h) 9%,#FFFFFF);border-radius:1cqi;padding-block:1cqi;padding-inline:3.6cqi 1.4cqi}
.s-example li::before,.s-quiz li::before{inset-inline-start:1.3cqi;top:calc(1cqi + .75em)}
.s-foot{position:absolute;bottom:2.4cqi;inset-inline:6cqi;display:flex;justify-content:space-between;gap:2cqi;font-size:1.5cqi;color:#6B7A8C;border-top:1px solid #E3E8EE;padding-top:1cqi}
.s-foot span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-corner{position:absolute;left:-6cqi;bottom:-6cqi;width:16cqi;height:16cqi;border-radius:50%;background:color-mix(in srgb,var(--h) 12%,transparent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px}
.thumb{border:0;padding:0;background:none;cursor:pointer;text-align:start;display:grid;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.thumb .slide{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.thumb:hover .slide{transform:translateY(-4px) scale(1.02);box-shadow:var(--shadow)}
.modal-box.wide{width:min(1100px,100%)}
.pres{display:grid;gap:12px}
.pres-slide.fwd{animation:slideIn .5s cubic-bezier(.2,.8,.2,1)}
.pres-slide.back{animation:slideBack .5s cubic-bezier(.2,.8,.2,1)}
.pres-slide .slide li{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.pres-slide .slide li:nth-child(1){animation-delay:.25s}.pres-slide .slide li:nth-child(2){animation-delay:.45s}.pres-slide .slide li:nth-child(3){animation-delay:.65s}.pres-slide .slide li:nth-child(4){animation-delay:.85s}.pres-slide .slide li:nth-child(5){animation-delay:1.05s}.pres-slide .slide li:nth-child(n+6){animation-delay:1.25s}
.pres-slide .s-cover h2{animation:rise .7s cubic-bezier(.2,.8,.2,1) .15s both}
.pres-stage:fullscreen{background:#0B1220;display:grid;place-items:center;padding:0}
.pres-stage:fullscreen .pres-slide{width:min(100vw,177.78vh)}
.pres-stage:fullscreen .slide{border-radius:0;border:0}
.pres-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap;min-width:120px}
.pdot{width:9px;height:9px;border-radius:99px;border:0;background:var(--line);cursor:pointer;padding:0;transition:width .3s,background .3s}
.pdot.on{width:26px;background:var(--brand)}
.pres-note{background:var(--warn-bg);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px}
.deckbar{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2);flex-wrap:wrap}
.deckbar .mini{width:190px;max-width:100%}
.deckbar small{display:block;color:var(--muted)}

/* generator */
.gen{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1050px){.gen{grid-template-columns:minmax(0,1fr)}}
.step{display:grid;gap:8px}
.step>b{display:flex;align-items:center;gap:8px;font-size:13px}
.step>b i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:12px}
.lesson-pick{display:grid;gap:6px;max-height:250px;overflow:auto;padding:2px}
.lesson-pick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:start;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;transition:border-color .2s,background .2s,transform .15s}
.lesson-pick button:hover{transform:translateX(-3px)}
.lesson-pick button.on{border-color:var(--brand);background:var(--brand-2);color:var(--brand)}
.btn.magic{background:linear-gradient(110deg,var(--brand) 0%,var(--accent) 50%,var(--brand) 100%);background-size:200% 100%;color:var(--on-brand);border:0;padding:12px 18px;font-size:15px;justify-content:center;animation:shimmer 3.5s linear infinite}
.gen-busy{display:grid;gap:14px;place-items:center;text-align:center;padding:36px 16px}
.stack{position:relative;width:200px;height:118px}
.stack span{position:absolute;inset:0;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stack span:nth-child(1){background:var(--brand);animation:deal 2.4s ease-in-out infinite}
.stack span:nth-child(2){background:var(--accent-2);animation:deal2 2.4s ease-in-out .3s infinite}
.stack span:nth-child(3){background:linear-gradient(var(--surface),var(--surface)) padding-box;border-inline-start:8px solid var(--accent)}
.gsteps{display:grid;gap:8px;text-align:start;padding:0;margin:0}
.gsteps li{list-style:none;display:flex;gap:8px;align-items:center;opacity:.35;animation:lit 8s infinite}
.gsteps li:nth-child(2){animation-delay:2s}.gsteps li:nth-child(3){animation-delay:4s}.gsteps li:nth-child(4){animation-delay:6s}
.elapsed{color:var(--muted);font-size:12.5px}
.gen-empty .body{text-align:center;display:grid;gap:10px;justify-items:center;padding-block:28px}
.gen-empty p{color:var(--muted);max-width:56ch;margin:0}
.fan{position:relative;height:210px;width:min(100%,440px)}
.fan-s{position:absolute;inset-inline:16%;top:24px;animation:fanIn .9s cubic-bezier(.2,.8,.2,1) var(--d) both;transform:rotate(var(--r))}
.fan-s .slide{box-shadow:var(--shadow)}
.plan{display:grid;gap:16px}
.plan-sec h4{font-size:15px;margin-bottom:6px;color:var(--brand)}
.plan ul{margin:0;padding-inline-start:20px}
.plan p{margin:0}
.timeline{display:grid;gap:8px}
.tl{display:flex;gap:10px}
.tl>span{background:var(--accent-2);color:var(--accent);border-radius:8px;padding:4px 8px;font-weight:700;height:max-content;white-space:nowrap}
.tl p{color:var(--muted);font-size:13px}

/* timetable tools, duties */
.ttcell{width:100%;border:0;background:none;cursor:pointer;padding:0;font:inherit}
.ttcell .slot{transition:transform .15s}
.ttcell:hover .slot{transform:scale(1.05)}
.ttcell.picked .slot{outline:3px solid var(--brand);outline-offset:2px;animation:swing .6s}
.conf{background:var(--bad-bg);border-radius:8px;padding:2px}
.conf::after{content:"⚠ تعارض معلم";display:block;color:var(--bad);font-size:10.5px;font-weight:700}
.duty-grid td,.duty-grid th{border:1px solid var(--line);vertical-align:top}
.duty-grid td{min-width:150px}
.duty-grid td.today{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.dchip{display:flex;justify-content:space-between;gap:6px;align-items:center;background:var(--surface-2);border-radius:7px;padding:4px 8px;margin-bottom:4px;font-size:12.5px;animation:pop .35s both}
.dchip b{font-weight:600;display:block}
.dchip small{color:var(--muted);display:block;font-size:11px}
.dchip .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.dchip .x:hover{color:var(--bad)}

/* virtual classrooms */
.room-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pf{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:12.5px;color:var(--pf)}
.card.room.live{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 16%,transparent)}
.card.room.off,.card.room.done{opacity:.7}
.countdown{font-size:12.5px;font-weight:700;color:var(--accent);display:grid;gap:4px}
.countdown .ic{width:15px;height:15px;vertical-align:-3px}
.creds{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:6px 10px}
.live-hero{background:var(--brand);color:var(--on-brand);border-radius:14px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.live-hero::before,.live-hero::after{content:"";position:absolute;left:-30px;top:-30px;width:170px;height:170px;border-radius:50%;border:2px solid currentColor;animation:pulseRing 2.6s infinite;pointer-events:none}
.live-hero::after{animation-delay:1.3s}
.live-hero .t{flex:1;min-width:200px;position:relative}
.live-hero h3{font-size:20px}
.live-hero p{margin:4px 0 0;opacity:.9}
.live-hero .btn{background:var(--on-brand);color:var(--brand);border:0;position:relative}
.vset{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.vset div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.vset small{color:var(--muted);display:block;font-size:12px}

/* honor */
.honor-me{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.honor-me>div:last-child{flex:1;min-width:220px;display:grid;gap:8px}
.honor-me p{margin:0;color:var(--muted)}
.pring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.pring>div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;align-content:center}
.pring b{font-family:var(--f-display);font-size:32px;display:block;line-height:1}
.pring small{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;display:grid;gap:6px;justify-items:center;background:var(--surface)}
.badge small{color:var(--muted);font-size:12px}
.badge .bi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn)}
.badge .bi .ic{width:26px;height:26px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge:not(.locked) .bi{animation:swing 3s ease-in-out infinite}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;text-align:center}
.podium .pl{display:grid;gap:4px;justify-items:center;min-width:0}
.podium .pl small{color:var(--muted)}
.podium .blk{width:100%;border-radius:10px 10px 0 0;background:var(--brand-2);color:var(--brand);font-family:var(--f-display);font-size:24px;display:grid;place-items:center;transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) .2s both}
.podium .p1 .blk{height:120px;background:var(--warn-bg);color:var(--warn)}
.podium .p2 .blk{height:88px}
.podium .p3 .blk{height:66px;background:var(--accent-2);color:var(--accent)}

/* AI tutor */
.tutor{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:linear-gradient(180deg,var(--accent-2),var(--surface) 70%)}
.tutor-head{display:flex;gap:8px;align-items:center;color:var(--accent);flex-wrap:wrap}
.tutor-head small{color:var(--muted)}
.tutor-log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.tutor-log .bub{max-width:92%}
.bub.ai{background:var(--surface);border:1px solid var(--line);white-space:pre-wrap}
.tutor-form{display:flex;gap:8px}
.typing-dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:bounce 1s infinite}
.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}

/* ================= v3: services ================= */
.navsec{font-size:11px;color:var(--muted);font-weight:700;padding:14px 12px 4px}
.idcard{max-width:560px;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.idc-top{background:var(--brand);color:var(--on-brand);display:flex;gap:10px;align-items:center;padding:14px 18px}

<script>
document.documentElement.lang='ar';
/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const avgN=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+ +x,0)/v.length:null};
const r0=v=>v==null?'—':Math.round(v);
const pct=v=>v==null?'—':Math.round(v)+'%';
const money=v=>Number(v).toLocaleString('en-US')+' ر.س';
function isoL(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
const TODAY=isoL(new Date());
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return isoL(d)}
const dow=s=>new Date(s+'T12:00:00').getDay();
const isSchoolDay=s=>dow(s)<=4;
function pastSchoolDays(n){const o=[];let s=addDays(TODAY,-1);while(o.length<n){if(isSchoolDay(s))o.push(s);s=addDays(s,-1)}return o.reverse()}
const LOC='ar-u-nu-latn';
const fmtD=s=>new Intl.DateTimeFormat(LOC,{day:'numeric',month:'long'}).format(new Date(s+'T12:00:00'));
const fmtDW=s=>new Intl.DateTimeFormat(LOC,{weekday:'long',day:'numeric',month:'long'}).format(new Date(s+'T12:00:00'));
const fmtT=ts=>new Intl.DateTimeFormat(LOC,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ts));
const daysTo=s=>Math.round((new Date(s+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5);
function dueLabel(s){const d=daysTo(s);if(d<0)return `انتهى قبل ${-d} ${-d===1?'يوم':'أيام'}`;if(d===0)return 'ينتهي اليوم';if(d===1)return 'ينتهي غدًا';return `بعد ${d} أيام · ${fmtD(s)}`}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}

const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const PERIODS=['07:15','08:00','08:45','09:45','10:30','11:15'];
const ROLE_NAME={admin:'الإدارة المدرسية',principal:'مدير المدرسة',teacher:'معلم',student:'طالب',parent:'ولي أمر'};

function spark(points,labels){
  if(!points.length)return empty('لا توجد بيانات');
  const W=320,H=96,P=8,mn=Math.min(...points,80),mx=100;
  const x=i=>P+i*(W-2*P)/Math.max(1,points.length-1), y=v=>P+(mx-v)/(mx-mn||1)*(H-2*P-14);
  const line=points.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last=points.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى نسبة الحضور">
   <line x1="${P}" x2="${W-P}" y1="${y(100)}" y2="${y(100)}" stroke="var(--line)" stroke-dasharray="3 3"/>
   <line x1="${P}" x2="${W-P}" y1="${y(90)}" y2="${y(90)}" stroke="var(--line)" stroke-dasharray="3 3"/>
   <polygon points="${x(0)},${y(mn)} ${line} ${x(last)},${y(mn)}" fill="var(--accent)" fill-opacity=".12"/>
   <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
   <circle cx="${x(last)}" cy="${y(points[last])}" r="4" fill="var(--accent)"/>
   <text x="${W-P}" y="${H-2}" text-anchor="end">${labels[0]}</text><text x="${P}" y="${H-2}" text-anchor="start">${labels[1]}</text>
   <text x="${W-P}" y="${y(90)-3}" text-anchor="end">90%</text>
  </svg>`}

function parts(sid,cid,sub){
  const m=(S.marks[cid+'|'+sub]||{})[sid]||{};
  const hw=avgN(S.assignments.filter(a=>a.classId===cid&&a.subjectId===sub).map(a=>{const x=a.subs[sid];if(x&&x.grade!=null)return x.grade/a.points;if(!x&&a.due<TODAY)return 0;return null}));
  const qz=avgN(S.quizzes.filter(q=>q.classId===cid&&q.subjectId===sub).map(q=>{const t=q.attempts[sid];if(t)return t.score/t.total;if(q.due<TODAY)return 0;return null}));
  const P={part:[m.part,10],hw:[hw==null?null:+(hw*20).toFixed(1),20],qz:[qz==null?null:+(qz*20).toFixed(1),20],mid:[m.mid,20],fin:[m.fin,30]};
  let got=0,max=0;for(const k in P){const[v,mx]=P[k];if(v!=null&&v!==''){got+=+v;max+=mx}}
  return{P,got,max,pct:max?got/max*100:null};
}
const studentAvg=s=>avgN(S.subjects.map(x=>parts(s.id,s.classId,x.id).pct));
function attStats(sid){const c={p:0,a:0,l:0,e:0};for(const d in S.att)for(const cid in S.att[d]){const v=S.att[d][cid][sid];if(v)c[v]++}const tot=c.p+c.a+c.l+c.e;return{...c,tot,rate:tot?(c.p+c.l)/tot*100:null}}
function attDays(sid){const o=[];Object.keys(S.att).sort().forEach(d=>{for(const cid in S.att[d]){const v=S.att[d][cid][sid];if(v)o.push([d,v])}});return o}
function attRateDay(d,cid){const day=S.att[d];if(!day)return null;const vals=[];for(const c in day){if(cid&&c!==cid)continue;vals.push(...Object.values(day[c]))}if(!vals.length)return null;return vals.filter(v=>v==='p'||v==='l').length/vals.length*100}
function schoolAttRate(cid){return avgN(Object.keys(S.att).map(d=>attRateDay(d,cid)))}
function pendingFor(s){
  const a=S.assignments.filter(x=>x.classId===s.classId&&!x.subs[s.id]&&x.due>=TODAY);
  const q=S.quizzes.filter(x=>x.classId===s.classId&&!x.attempts[s.id]&&x.due>=TODAY);
  return{a,q};
}
function teacherStats(t){
  const ls=S.lessons.filter(l=>l.teacherId===t.id).length;
  const as=S.assignments.filter(a=>a.teacherId===t.id);
  let subs=0,graded=0;as.forEach(a=>Object.values(a.subs).forEach(x=>{subs++;if(x.grade!=null)graded++}));
  const v=S.visits.filter(x=>x.teacherId===t.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return{ls,as:as.length,subs,graded,gp:subs?graded/subs*100:100,pend:subs-graded,visit:v?visitScore(v):null};
}
const visitScore=v=>v.scores.reduce((a,b)=>a+b,0)/(v.scores.length*5)*100;

    if(line.startsWith('## '))acc.push(`<h4>${line.slice(3)}</h4>`);

/* ---------- common: messages ---------- */
function contactsFor(u){
  let ids=[];
  if(u.role==='student')ids=byRole('teacher').map(x=>x.id);
  else if(u.role==='parent')ids=[...byRole('teacher'),...byRole('admin'),...byRole('principal')].map(x=>x.id);
  else if(u.role==='teacher')ids=[...byRole('principal'),...byRole('admin'),...byRole('teacher').filter(x=>x.id!==u.id),...byRole('parent'),...byRole('student')].map(x=>x.id);
  else ids=S.users.filter(x=>x.id!==u.id&&x.role!=='student').map(x=>x.id);
  S.messages.forEach(m=>{if(m.to===u.id&&!ids.includes(m.from))ids.push(m.from);if(m.from===u.id&&!ids.includes(m.to))ids.push(m.to)});
  const last=id=>{const t=S.messages.filter(m=>(m.from===id&&m.to===u.id)||(m.from===u.id&&m.to===id));return t.length?t[t.length-1]:null};
  return ids.map(U).filter(Boolean).map(c=>({c,last:last(c.id),unread:S.messages.filter(m=>m.from===c.id&&m.to===u.id&&!m.read).length})).sort((a,b)=>(b.last?.at||0)-(a.last?.at||0));
}
function roleLabel(c){
  if(c.role==='teacher')return 'معلم '+c.subjects.map(s=>subj(s).name).join(' و');
  if(c.role==='student')return 'طالب · '+cls(c.classId).name;
  if(c.role==='parent')return 'ولي أمر '+childrenOf(c).map(k=>k.name.split(' ')[0]).join(' و');
  return c.title||ROLE_NAME[c.role];
}
V.common.messages=u=>{
  const list=contactsFor(u);
  if(!ui.thread&&list[0])ui.thread=list[0].c.id;
  const other=U(ui.thread);
  if(other){let ch=false;S.messages.forEach(m=>{if(m.from===other.id&&m.to===u.id&&!m.read){m.read=true;ch=true}});if(ch)save()}
  const thread=other?S.messages.filter(m=>(m.from===other.id&&m.to===u.id)||(m.from===u.id&&m.to===other.id)):[];
  const q=ui.q.trim();
  const shown=q?list.filter(x=>x.c.name.includes(q)):list;
  return `${phead('الرسائل','تواصل مباشر وآمن بين المدرسة والمعلمين والطلاب وأولياء الأمور')}
  <section class="panel msgs">

    ${shown.map(({c,last,unread})=>`<button class="contact ${c.id===ui.thread?'on':''}" data-act="thread" data-id="${c.id}">${av(c,'sm')}<span class="t"><b>${esc(c.name)}</b><small>${last?esc(last.text):esc(roleLabel(c))}</small></span>${unread?`<span class="cnt">${unread}</span>`:''}</button>`).join('')}</div>
   <div class="convo">${other?`<div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center">${av(other)}<div><b>${esc(other.name)}</b><div style="color:var(--muted);font-size:12.5px">${esc(roleLabel(other))}</div></div></div>
    <div class="stream">${thread.length?thread.map(m=>`<div class="bub ${m.from===u.id?'mine':''}">${esc(m.text)}<small>${fmtT(m.at)}</small></div>`).join(''):empty('ابدأ المحادثة بكتابة رسالتك')}</div>
    <form data-form="sendMsg"><input type="hidden" name="to" value="${other.id}"><input type="text" name="text" id="msg-text" placeholder="اكتب رسالة…" autocomplete="off" required><button class="btn primary">إرسال</button></form>`:empty('اختر جهة اتصال')}</div>
  </section>`;
};

function confetti(){
  if(reduced()||typeof document.createElement!=='function')return;
  const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');
  const cols=['#16467A','#0E8F72','#E3B04B','#BC3B33','#7A4FB0','#2F6FB0','#3CC9A2'];
  const P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*240,y:H*.38,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,s:Math.random()*.3-.15}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<160)requestAnimationFrame(f);else c.remove()})();
}
function countUp(el){const m=el.textContent.trim().match(/^(\d[\d,]*)(.*)$/);if(!m)return;const target=+m[1].replace(/,/g,'');if(!target||target>1e6)return;const comma=m[1].includes(',');const suf=m[2];const t0=performance.now();
  (function f(now){const k=Math.min(1,(now-t0)/900),e=1-Math.pow(1-k,3),v=Math.round(target*e);el.textContent=(comma?v.toLocaleString('en-US'):v)+suf;if(k<1)requestAnimationFrame(f)})(t0)}

const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
function bellInfo(u){
  if(!isSchoolDay(TODAY))return{txt:'عطلة نهاية الأسبوع',pct:0,st:'off'};
  const n=new Date(),m=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,d=dow(TODAY);
  for(let i=0;i<PERIOD_RANGES.length;i++){const a=toMin(PERIOD_RANGES[i][0]),b=toMin(PERIOD_RANGES[i][1]);if(m>=a&&m<b){
    let what='';
    if(u.role==='student'){const s=S.timetable[u.classId]?.[d]?.[i]?.subjectId;if(s)what=' · '+subj(s).name}
    else if(u.role==='teacher'){const c=S.classes.find(c=>{const s=S.timetable[c.id]?.[d]?.[i]?.subjectId;return s&&u.subjects.includes(s)});const sb=S.subs.find(x=>x.subId===u.id&&x.date===TODAY&&x.p===i);what=sb?' · انتظار '+cls(sb.classId).name:c?' · '+c.name:' · فراغ'}
    return{txt:`الحصة ${ORD[i]}${what} · متبقٍ ${Math.ceil(b-m)} د`,pct:(m-a)/(b-a)*100,st:'on'}}}
  if(m>=toMin('09:30')&&m<toMin('09:45'))return{txt:`الفسحة · متبقٍ ${Math.ceil(toMin('09:45')-m)} د`,pct:(m-toMin('09:30'))/15*100,st:'break'};
  if(m<toMin('07:15'))return{txt:'يبدأ اليوم الدراسي 07:15',pct:0,st:'off'};
  return{txt:'انتهى اليوم الدراسي',pct:100,st:'off'};
}

  const mk=date=>{const[h,m]=r.time.split(':').map(Number);const d=new Date(date+'T00:00:00');d.setHours(h,m,0,0);return{date,start:d.getTime(),end:d.getTime()+r.duration*60e3}};
  if(r.date)return mk(r.date);
  for(let i=0;i<15;i++){const dt=addDays(TODAY,i);if(!(r.days||[]).includes(dow(dt)))continue;const o=mk(dt);if(o.end>now)return o}

/* ---------- timetable management ---------- */
function ttConflicts(){const out=[];DAYS.forEach((_,d)=>PERIODS.forEach((_,p)=>{const m={};S.classes.forEach(c=>{const s=S.timetable[c.id]?.[d]?.[p]?.subjectId;if(!s)return;const t=teacherOf(s);if(!t)return;(m[t.id]=m[t.id]||[]).push(c.id)});for(const tid in m)if(m[tid].length>1)out.push({d,p,tid,classes:m[tid]})}));return out}
const isConf=(conf,cid,d,p)=>conf.some(x=>x.d===d&&x.p===p&&x.classes.includes(cid));
const teacherLoadCount=T=>S.classes.reduce((s,c)=>s+DAYS.reduce((a,_,d)=>a+PERIODS.filter((_,p)=>T.subjects.includes(S.timetable[c.id]?.[d]?.[p]?.subjectId)).length,0),0);
function ttLogAdd(text){S.ttLog.unshift({at:Date.now(),by:me().id,text});S.ttDirty=true;if(S.ttLog.length>200)S.ttLog.length=200}
V.common.timetable=u=>{
  const t=ui.tt||(ui.tt={mode:'edit',cls:S.classes[0]?.id,teacher:byRole('teacher')[0]?.id,pick:null});
  if(!S.classes.some(c=>c.id===t.cls))t.cls=S.classes[0]?.id;
  const conf=ttConflicts();
  const modes=[['edit','تعديل الحصص','edit'],['swap','تبديل حصتين','swap'],['teacher','جدول المعلم','users'],['log','سجل التعديلات','file']];
  const head=phead('الجداول الدراسية','عدّل الحصص أو بدّل بينها بالنقر، وتابع التعارضات قبل نشر الجدول المحدّث للمعلمين والطلاب',`${S.ttDirty?pill('تعديلات غير منشورة','warn'):pill('الجدول منشور','good')}${S.ttDirty?`<button class="btn" data-act="confirm" data-do="ttRevert">تراجع عن التعديلات</button>`:''}<button class="btn primary" data-act="ttPublish" ${S.ttDirty?'':'disabled'}>${ic('mega')} نشر وإشعار الجميع</button>`);
  const clsChips=`<div class="chips">${S.classes.map(c=>`<button class="chip ${t.cls===c.id?'on':''}" data-act="ttSel" data-k="cls" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
  const confBox=conf.length?`<div class="pres-note" style="background:var(--bad-bg)"><b>${conf.length} تعارض في الجدول:</b> ${conf.slice(0,4).map(x=>`${esc(U(x.tid)?.name)} – ${DAYS[x.d]} الحصة ${x.p+1} (${x.classes.map(c=>esc(cls(c).name)).join(' و')})`).join('، ')}</div>`:'';
  let body='';
  if(t.mode==='edit')body=clsChips+confBox+panel('تعديل جدول '+esc(cls(t.cls).name),ttTable((d,p)=>{const v=S.timetable[t.cls]?.[d]?.[p]?.subjectId||'';return `<div class="${isConf(conf,t.cls,d,p)?'conf':''}"><select data-chg="tt" data-c="${t.cls}" data-d="${d}" data-p="${p}" id="tt-${t.cls}-${d}-${p}" aria-label="الحصة" style="border-color:${v?subj(v).hue:'var(--line)'}"><option value="">— فراغ —</option>${S.subjects.map(s=>`<option value="${s.id}" ${v===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`},false));
  else if(t.mode==='swap')body=clsChips+confBox+panel('تبديل الحصص · '+esc(cls(t.cls).name),`<p class="note" style="margin-bottom:10px">${t.pick?`محددة: ${DAYS[t.pick.d]} الحصة ${t.pick.p+1}. اختر الحصة الثانية لإتمام التبديل، أو اضغط الحصة نفسها للإلغاء.`:'اضغط على حصة ثم على حصة أخرى لتبديل مكانيهما.'}</p>`+ttTable((d,p)=>{const v=S.timetable[t.cls]?.[d]?.[p]?.subjectId;const pk=t.pick&&t.pick.d===d&&t.pick.p===p;return `<div class="${isConf(conf,t.cls,d,p)?'conf':''}"><button class="ttcell ${pk?'picked':''}" data-act="ttPick" data-d="${d}" data-p="${p}">${v?slotHtml(v,esc(teacherOf(v)?.name||'')):'<div class="slot" style="color:var(--muted)">فراغ</div>'}</button></div>`},false));
  else if(t.mode==='teacher'){const T=U(t.teacher);body=`<div class="chips">${byRole('teacher').map(x=>`<button class="chip ${t.teacher===x.id?'on':''}" data-act="ttSel" data-k="teacher" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>`+(T?panel('جدول '+esc(T.name)+' · '+teacherLoadCount(T)+' حصة أسبوعيًا',ttTable((d,p)=>S.classes.map(c=>{const s=S.timetable[c.id]?.[d]?.[p]?.subjectId;return s&&T.subjects.includes(s)?`<div class="${isConf(conf,c.id,d,p)?'conf':''}">${slotHtml(s,esc(c.name))}</div>`:''}).join(''),true)):'')}
  else body=panel('سجل التعديلات',S.ttLog.length?`<div class="list">${S.ttLog.slice(0,80).map(x=>`<div class="li">${av(U(x.by),'sm')}<div class="t"><b>${esc(x.text)}</b><small>${esc(U(x.by)?.name||'')} · ${fmtT(x.at)}</small></div></div>`).join('')}</div>`:empty('لا توجد تعديلات'));
  return head+`<div class="chips">${modes.map(([k,l,i])=>`<button class="chip ${t.mode===k?'on':''}" data-act="ttSel" data-k="mode" data-id="${k}">${ic(i)} ${l}</button>`).join('')}</div>`+body;
};

/* ---------- substitutions ---------- */
const nextSchoolDay=s=>{let x=s;while(!isSchoolDay(x))x=addDays(x,1);return x};
function teacherPeriods(tid,d){const t=U(tid);const out=[];if(!t)return out;PERIODS.forEach((_,p)=>S.classes.forEach(c=>{const s=S.timetable[c.id]?.[d]?.[p]?.subjectId;if(s&&t.subjects.includes(s))out.push({p,cid:c.id,subjectId:s})}));return out}
function busyAt(tid,d,p,date){const t=U(tid);if(S.classes.some(c=>t.subjects.includes(S.timetable[c.id]?.[d]?.[p]?.subjectId)))return true;return S.subs.some(x=>x.date===date&&x.p===p&&x.subId===tid)}
function weekSubs(tid){const wk=addDays(TODAY,-dow(TODAY));return S.subs.filter(x=>x.subId===tid&&x.date>=wk&&x.date<addDays(wk,7)).length}
V.common.subs=u=>{
  const date=ui.subDate||nextSchoolDay(TODAY),d=dow(date),abs=ui.subAbs||'';const T=byRole('teacher');
  const dayList=S.subs.filter(x=>x.date===date);
  const rows=(abs&&isSchoolDay(date)?teacherPeriods(abs,d):[]).map(n=>{const cur=dayList.find(x=>x.absentId===abs&&x.p===n.p&&x.classId===n.cid);const free=T.filter(t=>t.id!==abs&&(!busyAt(t.id,d,n.p,date)||cur?.subId===t.id)).sort((a,b)=>weekSubs(a.id)-weekSubs(b.id));return{n,cur,free}});
  return `${phead('حصص الانتظار','عند غياب معلم يعرض النظام حصصه ويقترح المعلمين المتاحين في كل حصة مع مراعاة عدالة التوزيع')}
  <div class="tools"><input type="date" id="sub-date" value="${date}" data-chg="subDate" style="width:auto"><select id="sub-abs" data-chg="subAbs"><option value="">اختر المعلم الغائب…</option>${opts(T.map(t=>[t.id,t.name]),abs)}</select></div>
  ${!isSchoolDay(date)?`<div class="pres-note">التاريخ المختار عطلة نهاية أسبوع.</div>`:''}
  ${abs&&isSchoolDay(date)?`<form data-form="subs" class="panel"><input type="hidden" name="_date" value="${date}"><input type="hidden" name="_abs" value="${abs}"><header><h3>حصص ${esc(U(abs)?.name)} · ${fmtDW(date)}</h3><div class="tools"><button type="button" class="btn" data-act="subAuto">${ic('spark')} توزيع تلقائي</button><button class="btn primary">اعتماد وإشعار المعلمين</button></div></header>
   <div class="body">${rows.length?`<div class="list">${rows.map(({n,cur,free})=>`<div class="li" style="flex-wrap:wrap"><b class="num" style="min-width:70px">الحصة ${n.p+1}<br><small style="color:var(--muted)">${PERIODS[n.p]}</small></b><div class="t" style="min-width:140px"><b>${esc(cls(n.cid).name)}</b><small>${esc(subj(n.subjectId).name)}</small></div><select name="${n.p}|${n.cid}" id="sub-${n.p}-${n.cid}" data-p="${n.p}" style="width:auto;min-width:220px"><option value="">— بدون بديل —</option>${free.map(t=>`<option value="${t.id}" ${cur?.subId===t.id?'selected':''}>${esc(t.name)} (انتظار الأسبوع: ${weekSubs(t.id)})</option>`).join('')}</select></div>`).join('')}</div>`:empty('لا توجد حصص لهذا المعلم في هذا اليوم')}</div></form>`:''}
  <div class="cols">${panel('حصص الانتظار المعتمدة · '+fmtD(date),dayList.length?`<div class="list">${dayList.sort((a,b)=>a.p-b.p).map(x=>`<div class="li"><b class="num">ح${x.p+1}</b><div class="t"><b>${esc(U(x.subId)?.name)}</b><small>بدلًا من ${esc(U(x.absentId)?.name)} · ${esc(cls(x.classId).name)} · ${esc(subj(x.subjectId).name)}</small></div><button class="btn sm ghost danger" data-act="subDel" data-id="${x.id}" aria-label="حذف">${ic('trash')}</button></div>`).join('')}</div>`:empty('لا توجد حصص انتظار لهذا اليوم'))}
   ${panel('عدالة التوزيع هذا الأسبوع',bars(T.map(t=>[t.name,weekSubs(t.id),'info']),Math.max(3,...T.map(t=>weekSubs(t.id))),v=>v))}</div>`;
};

/* ---------- slides & presentations ---------- */
function slidesFromLesson(l){
  const slides=[{kind:'title',title:l.title,bullets:[l.unit||''].filter(Boolean),note:''}];let cur=null;
  String(l.body||'').split('\n').forEach(line=>{line=line.trim();if(!line)return;
    if(line.startsWith('## ')){cur={kind:'content',title:line.slice(3),bullets:[],note:''};slides.push(cur);return}
    if(!cur){cur={kind:'content',title:'مقدمة',bullets:[],note:''};slides.push(cur)}
    if(line.startsWith('> ')){cur.bullets.push(line.slice(2));if(cur.kind==='content')cur.kind='example';return}
    cur.bullets.push(line.replace(/^- /,''))});
  slides.push({kind:'summary',title:'ملخص وأسئلة',bullets:['راجع الأفكار الرئيسة للدرس','اكتب سؤالًا لم تفهمه وشاركه في نقاش الشرح','حل الواجب المرتبط بالدرس على منصة مدار'],note:''});
  return {title:l.title,subjectId:l.subjectId,unit:l.unit,grade:'',teacher:U(l.teacherId)?.name||'',slides};
}
function deckOf(src,id){
  if(src==='gen'){const g=S.genLib.find(x=>x.id===id);return g&&{title:g.title,subjectId:g.subjectId,grade:g.grade,unit:g.unit,teacher:U(g.by)?.name||'',slides:g.slides}}
  const l=S.lessons.find(x=>x.id===id);if(!l)return null;return l.deck||slidesFromLesson(l);
}

  const k=KIND[s.kind]||KIND.content,len=(s.bullets||[]).join('').length;

const LEVELS=['مستكشف','مجتهد','متميز','مبدع','أسطورة مدار'];
function points(s){const beh=S.behavior.filter(b=>b.sid===s.id).reduce((a,b)=>a+b.pts*5,0);const q=S.quizzes.reduce((a,x)=>{const t=x.attempts[s.id];return a+(t?Math.round(t.score/t.total*10):0)},0);const hw=S.assignments.filter(a=>a.subs[s.id]).length*3;const les=S.lessons.filter(l=>l.views.includes(s.id)).length*2;const r=attStats(s.id).rate||0;const ab=r>=98?30:r>=95?15:r>=90?5:0;const parts={beh:Math.max(0,beh),q,hw,les,ab};return{total:Object.values(parts).reduce((a,b)=>a+b,0),parts}}
const levelOf=p=>{const i=Math.min(LEVELS.length-1,Math.floor(p/100));return{i,name:LEVELS[i],pct:i===LEVELS.length-1?100:p%100}};
const BADGES=[
  {name:'نجم الفصل',desc:'معدل عام 90% فأعلى',icon:'star',test:s=>studentAvg(s)>=90},
  {name:'المنضبط',desc:'نسبة حضور 97% فأعلى',icon:'clock',test:s=>attStats(s.id).rate>=97},
  {name:'المثابر',desc:'سلّم جميع الواجبات المنتهية',icon:'task',test:s=>S.assignments.filter(a=>a.classId===s.classId&&a.due<TODAY).every(a=>a.subs[s.id])},
  {name:'القارئ النهم',desc:'شاهد كل شروح فصله',icon:'book',test:s=>{const l=S.lessons.filter(x=>x.classIds.includes(s.classId));return l.length>0&&l.every(x=>x.views.includes(s.id))}},
  {name:'الدرجة الكاملة',desc:'درجة كاملة في اختبار قصير',icon:'quiz',test:s=>S.quizzes.some(q=>{const t=q.attempts[s.id];return t&&t.score===t.total})},
  {name:'القدوة الحسنة',desc:'ملاحظة سلوكية إيجابية',icon:'heart',test:s=>S.behavior.some(b=>b.sid===s.id&&b.type==='pos')},
  {name:'السائل الذكي',desc:'طرح سؤالًا على شرح',icon:'msg',test:s=>S.lessons.some(l=>l.comments.some(c=>c.by===s.id))},
  {name:'حاضر الحصص المباشرة',desc:'انضم إلى حصة افتراضية',icon:'video',test:s=>S.rooms.some(r=>r.joins.some(j=>j.uid===s.id))}];
function honorView(s,title){
  const P=points(s),L=levelOf(P.total),got=BADGES.filter(b=>b.test(s)).length;
  const cl=studentsOf(s.classId).map(x=>({x,p:points(x).total})).sort((a,b)=>b.p-a.p);const rank=cl.findIndex(r=>r.x.id===s.id)+1;const top=cl.slice(0,3);
  return `${phead(title,esc(s.name)+' · '+esc(cls(s.classId).name))}

  ${panel('لوحة شرف '+esc(cls(s.classId).name),`<div class="podium">${[[top[1],2],[top[0],1],[top[2],3]].map(([r,k])=>r?`<div class="pl p${k}">${av(r.x)}<b>${esc(r.x.name.split(' ')[0])}</b><small class="num">${r.p} نقطة</small><div class="blk">${k}</div></div>`:'<div></div>').join('')}</div>`)}</div>
  ${panel(`الأوسمة (${got} من ${BADGES.length})`,`<div class="badges">${BADGES.map(b=>`<div class="badge ${b.test(s)?'':'locked'}"><span class="bi">${ic(b.icon)}</span><b>${b.name}</b><small>${b.desc}</small></div>`).join('')}</div>`)}

async function exportPdf(el,name){
  if(!el)return;if(typeof html2canvas==='undefined'||!window.jspdf){toast('تعذّر تحميل مكتبة PDF، تحقق من الاتصال');return}
  if(!canSave()){toast('حفظ الملفات غير متاح هنا');return}
  toast('جارٍ تجهيز ملف PDF…');let canvas;
  try{canvas=await html2canvas(el,{scale:2,backgroundColor:'#FFFFFF'})}catch(e){toast('تعذّر إنشاء PDF');return}
  const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=24,iw=pw-2*m,pageH=(ph-2*m)*canvas.width/iw;let y=0,first=true;
  while(y<canvas.height){const h=Math.min(pageH,canvas.height-y);const c=document.createElement('canvas');c.width=canvas.width;c.height=h;const x=c.getContext('2d');x.fillStyle='#FFFFFF';x.fillRect(0,0,c.width,h);x.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);if(!first)pdf.addPage();first=false;pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,h*iw/canvas.width);y+=h}
  const fn=String(name||'تقرير').replace(/[\\/:*?"<>|]/g,'').slice(0,80)+'.pdf';
  if(CAP.downloads){try{await CAP.downloads.save({filename:fn,data:pdf.output('blob')});toast('تم حفظ الملف')}catch(e){if(!e||e.code!=='declined')toast('تعذّر حفظ الملف')}}
  else{pdf.save(fn);toast('تم تنزيل الملف')}
}

function gateScan(code){
  const s=studentByCode(code),mode=ui.gateMode||'in';

  S.gate[TODAY]=S.gate[TODAY]||{};const g=S.gate[TODAY][s.id]=S.gate[TODAY][s.id]||{};const now=Date.now(),fn=s.name.split(' ')[0];
  if(mode==='in'){

      ui.gateLast=`<div class="scan-res ${late?'warn':'good'}">${av(s)}<div><b>${esc(s.name)}</b><small>${esc(cls(s.classId).name)} · ${hm(now)}${late?' · متأخر':''} · أُشعر ولي الأمر</small></div>${ic('check')}</div>`}
  }else{
    if(g.out)ui.gateLast=`<div class="scan-res warn">${av(s)}<div><b>${esc(s.name)}</b><small>انصرف مسبقًا الساعة ${hm(g.out)}</small></div></div>`;

}

const weakSubs=s=>S.subjects.map(x=>({x,p:parts(s.id,s.classId,x.id).pct})).filter(o=>o.p!=null).sort((a,b)=>a.p-b.p);
function remedCands(u){return byRole('student').map(s=>{const lowS=weakSubs(s).filter(o=>o.p<65&&(u.role!=='teacher'||u.subjects.includes(o.x.id)));return{s,lowS,r:attStats(s.id).rate,avg:studentAvg(s)}})
  .filter(c=>(u.role==='teacher'?c.lowS.length:(c.lowS.length||c.avg<65||c.r<90))&&!S.plans.some(p=>p.sid===c.s.id&&p.status==='active'))}
function makePlan(s,by){
  const w=weakSubs(s);let low=w.filter(o=>o.p<65);if(!low.length)low=w.slice(0,1);const r=attStats(s.id).rate||100;
  const goals=low.map(o=>`رفع مستوى ${o.x.name} من ${Math.round(o.p)}% إلى ${Math.min(Math.round(o.p)+15,85)}% خلال 4 أسابيع`);if(r<90)goals.push(`رفع نسبة الحضور من ${Math.round(r)}% إلى 95% فأكثر`);
  const actions=[];low.forEach(o=>{const t=teacherOf(o.x.id);actions.push(`حصة تقوية أسبوعية في ${o.x.name}${t?' مع أ. '+t.name:''}`);const ls=S.lessons.filter(l=>l.subjectId===o.x.id&&l.classIds.includes(s.classId)&&!l.views.includes(s.id));actions.push(ls.length?`مشاهدة الشروح غير المكتملة: ${ls.map(l=>l.title).join('، ')}`:`ورقة عمل علاجية في أهم مهارات ${o.x.name}`);actions.push(`اختبار قصير تشخيصي في ${o.x.name} نهاية الأسبوع الثاني`)});
  if(r<90)actions.push('متابعة يومية للحضور مع وكيل شؤون الطلاب');actions.push('تواصل أسبوعي مع ولي الأمر عبر الرسائل');
  return {id:uid('pl'),sid:s.id,by,created:TODAY,subjects:low.map(o=>o.x.id),baseAvg:studentAvg(s),goals,actions,weeks:[0,1,2,3].map(()=>({done:false})),status:'active',ai:''};
}

/* ---------- 6. school buses ---------- */
function busPos(b){
  if(!isSchoolDay(TODAY))return{phase:'idle',prog:1,txt:'عطلة نهاية الأسبوع – الحافلة متوقفة'};
  const n=new Date(),m=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,mS=toMin('06:15'),mE=toMin('07:05'),aS=toMin('12:10'),aE=toMin('13:00');
  if(m>=mS&&m<mE)return{phase:'morning',prog:(m-mS)/(mE-mS),txt:'رحلة الذهاب إلى المدرسة جارية'};
  if(m>=aS&&m<aE)return{phase:'afternoon',prog:1-(m-aS)/(aE-aS),txt:'رحلة العودة من المدرسة جارية'};
  if(m<mS)return{phase:'before',prog:0,txt:'تبدأ رحلة الذهاب 06:15'};
  if(m<aS)return{phase:'school',prog:1,txt:'الحافلة متوقفة في المدرسة · رحلة العودة 12:10'};
  return{phase:'done',prog:0,txt:'انتهت رحلات اليوم'};
}
function routeHtml(b,hl){const P=busPos(b),n=b.stops.length;
  return `<div class="route"><div class="rline"><i class="rfill" style="width:${P.prog*100}%"></i></div>${b.stops.map((s,i)=>`<div class="rstop ${i===hl?'hl':''} ${i===n-1?'sch':''}" style="right:${i/(n-1)*100}%"><i></i><small>${esc(s)}</small></div>`).join('')}<div class="rbus ${P.phase}" data-bus="${b.id}" style="right:${P.prog*100}%">${ic('bus')}</div></div><p class="note">${P.txt}</p>`}
V.admin.buses=u=>{const lg=S.busLog[TODAY]||{};
  return phead('النقل المدرسي','تتبع الحافلات وتسجيل صعود الطلاب ونزولهم مع إشعار أولياء الأمور')+`<div class="stats">${stat('الحافلات',S.buses.length)}${stat('طلاب النقل',S.buses.reduce((a,b)=>a+Object.keys(b.riders).length,0))}${stat('صعدوا اليوم',Object.values(lg).filter(x=>x.board).length,'','good')}</div>`+
  S.buses.map(b=>panel(`${esc(b.name)} · ${esc(b.route)}`,`<div class="tablewrap">${routeHtml(b,-1)}</div>
   <div class="vset" style="margin-block:12px"><div><small>السائق</small><b>${esc(b.driver)}</b></div><div><small>الجوال</small><b class="num" style="user-select:all">${esc(b.phone)}</b></div><div><small>اللوحة</small><b>${esc(b.plate)}</b></div><div><small>الطلاب</small><b class="num">${Object.keys(b.riders).length}</b></div></div>
   <div class="list">${Object.entries(b.riders).map(([sid,k])=>{const s=U(sid);if(!s)return '';const l=lg[sid]||{};return `<div class="li" style="flex-wrap:wrap">${av(s,'sm')}<div class="t"><b>${esc(s.name)}</b><small>${esc(b.stops[k])}</small></div>${l.board?pill('صعد '+hm(l.board),'good'):`<button class="btn sm" data-act="busMark" data-id="${sid}" data-k="board">صعد</button>`}${l.drop?pill('نزل '+hm(l.drop),'info'):`<button class="btn sm ghost" data-act="busMark" data-id="${sid}" data-k="drop">نزل</button>`}</div>`}).join('')}</div>`)).join('')};
function myBus(s,title){const b=S.buses.find(x=>s.id in x.riders);if(!b)return phead(title,'')+empty('الطالب غير مسجل في النقل المدرسي');
  const k=b.riders[s.id],P=busPos(b),pos=k/(b.stops.length-1);let eta='';
  if(P.phase==='morning'&&P.prog<pos)eta=`تصل الحافلة إلى محطتك بعد ${Math.max(1,Math.round((pos-P.prog)*50))} دقيقة`;
  else if(P.phase==='afternoon'&&P.prog>pos)eta=`تصل الحافلة إلى محطتك بعد ${Math.max(1,Math.round((P.prog-pos)*50))} دقيقة`;
  const l=(S.busLog[TODAY]||{})[s.id]||{};
  return phead(title,esc(b.name)+' · '+esc(b.route))+(eta?`<section class="live-hero"><div class="t"><h3>${eta}</h3><p>محطتك: ${esc(b.stops[k])}</p></div></section>`:'')+
   `<div class="stats">${stat('المحطة',esc(b.stops[k]))}${stat('الصعود اليوم',l.board?hm(l.board):'—','',l.board?'good':'')}${stat('النزول اليوم',l.drop?hm(l.drop):'—')}</div>`+
   panel('موقع الحافلة الآن',`<div class="tablewrap">${routeHtml(b,k)}</div>`)+
   panel('بيانات الحافلة',`<div class="vset"><div><small>السائق</small><b>${esc(b.driver)}</b></div><div><small>الجوال</small><b class="num" style="user-select:all">${esc(b.phone)}</b></div><div><small>اللوحة</small><b>${esc(b.plate)}</b></div><div><small>مواعيد الرحلات</small><b class="num">06:15 – 07:05 · 12:10 – 13:00</b></div></div><p class="note" style="margin-top:8px">الموقع محسوب من جدول الرحلة، ويُربط بجهاز تتبع GPS في الحافلة في النسخة الفعلية.</p>`)}

V.student.library=u=>{const tab=tabOf('ltab','books'),mine=S.reads.filter(r=>r.sid===u.id),goal=S.readGoal,loans=S.loans.filter(l=>l.sid===u.id&&!l.ret);

  else body=panel('سجل قراءاتي',mine.length?`<div class="list">${mine.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="li" style="align-items:flex-start"><div class="t"><b>${esc(bookOf(r.bookId).title)}</b><small>${fmtD(r.date)} · ${r.pages} صفحة · <span class="stars">${'★'.repeat(r.stars||0)}</span></small><small>${esc(r.summary)}</small></div></div>`).join('')}</div>`:empty('لم تسجل أي قراءة بعد'));
  return phead('المكتبة الرقمية وتحدي القراءة',`هدف الفصل الدراسي: ${goal} كتب · كل كتاب = 5 نقاط`,`<button class="btn primary" data-act="readLog">${ic('plus')} سجّل قراءة</button>`)+
   `<div class="cols"><section class="panel"><div class="body honor-me"><div class="pring" style="--p:${Math.min(100,Math.round(mine.length/goal*100))}"><div><b class="num">${mine.length}</b><small>من ${goal} كتب</small></div></div><div><h3>${mine.length>=goal?'أنجزت التحدي!':`باقي ${goal-mine.length} كتب لإكمال التحدي`}</h3><p>${mine.reduce((a,r)=>a+(+r.pages||0),0)} صفحة مقروءة</p></div></div></section>
    ${panel('متصدرو القراءة في فصلك',`<div class="list">${board.map((x,i)=>`<div class="li"><b class="num" style="width:20px">${i+1}</b>${av(x.s,'sm')}<div class="t"><b>${esc(x.s.name)}${x.s.id===u.id?' (أنت)':''}</b></div>${pill(x.n+' كتب','warn')}</div>`).join('')}</div>`)}</div>`+
   tabsHtml('ltab',[['books','الكتب','library'],['loans','استعاراتي','book'],['log','سجل قراءاتي','check']])+body};
V.admin.library=u=>{const tab=tabOf('latab','loans'),act=S.loans.filter(l=>!l.ret),over=act.filter(l=>l.due<TODAY);let body='';
  if(tab==='loans')body=panel('الاستعارات الحالية',act.length?`<div class="tablewrap"><table><thead><tr><th>الكتاب</th><th>الطالب</th><th>تاريخ الاستعارة</th><th>الإرجاع</th><th></th></tr></thead><tbody>${act.sort((a,b)=>a.due.localeCompare(b.due)).map(l=>`<tr><td><b>${esc(bookOf(l.bookId).title)}</b></td><td>${esc(U(l.sid)?.name||'')}</td><td class="num">${fmtD(l.date)}</td><td>${l.due<TODAY?pill('متأخر منذ '+fmtD(l.due),'bad'):fmtD(l.due)}</td><td><div class="tools"><button class="btn sm accent" data-act="returnLoan" data-id="${l.id}">استلام</button>${l.due<TODAY?`<button class="btn sm ghost" data-act="remindLoan" data-id="${l.id}">تذكير</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:empty('لا استعارات'));
  else if(tab==='books')body=panel('الكتب',`<div class="books">${S.books.map(b=>`<div class="book">${coverHtml(b)}<div class="meta">${esc(b.cat)} · ${b.copies} نسخ · متاح ${availCopies(b)}</div></div>`).join('')}</div>`,`<button class="btn sm primary" data-act="bookAdd">${ic('plus')} كتاب جديد</button>`);
  else{const top=byRole('student').map(s=>({s,n:S.reads.filter(r=>r.sid===s.id).length})).sort((a,b)=>b.n-a.n).slice(0,10);body=`<div class="cols">${panel('القراءة حسب الفصل',bars(S.classes.map(c=>[c.name,S.reads.filter(r=>U(r.sid)?.classId===c.id).length,'info']),Math.max(1,...S.classes.map(c=>S.reads.filter(r=>U(r.sid)?.classId===c.id).length)),v=>v))}${panel('أبطال تحدي القراءة',`<div class="list">${top.map((x,i)=>`<div class="li"><b class="num" style="width:20px">${i+1}</b>${av(x.s,'sm')}<div class="t"><b>${esc(x.s.name)}</b><small>${esc(cls(x.s.classId).name)}</small></div>${pill(x.n+' / '+S.readGoal,x.n>=S.readGoal?'good':'warn')}</div>`).join('')}</div>`)}</div>`}
  return phead('المكتبة الرقمية','الكتب والاستعارات وتحدي القراءة على مستوى المدرسة')+`<div class="stats">${stat('الكتب',S.books.length)}${stat('استعارات حالية',act.length)}${stat('متأخرة',over.length,'',over.length?'bad':'good')}${stat('قراءات مسجلة',S.reads.length,'','good')}</div>`+tabsHtml('latab',[['loans','الاستعارات','book'],['books','الكتب','library'],['challenge','تحدي القراءة','trophy']])+body};

const _ah3=V.admin.home;V.admin.home=u=>{const g=S.gate[TODAY]||{},studs=byRole('student'),inN=studs.filter(s=>g[s.id]?.in).length,over=S.loans.filter(l=>!l.ret&&l.due<TODAY).length,low=studs.filter(s=>(S.canteen.wallet[s.id]||0)<10).length;

Object.assign(A,{
  setUi(d){ui[d.k]=d.id;render()},
  pdf(d){exportPdf(document.getElementById(d.t),d.n)},
  gateTap(d){gateScan(d.id)},
  gateAbsent(){const g=S.gate[TODAY]||{};let n=0;byRole('student').filter(s=>!g[s.id]?.in).forEach(s=>{if(isSchoolDay(TODAY)){S.att[TODAY]=S.att[TODAY]||{};S.att[TODAY][s.classId]=S.att[TODAY][s.classId]||{};if(S.att[TODAY][s.classId][s.id]!=='e')S.att[TODAY][s.classId][s.id]='a'}notify(s.parentId,`لم يصل ${s.name.split(' ')[0]} إلى المدرسة اليوم ${fmtDW(TODAY)}. إن كان لديه عذر يمكنك إرساله من «الأعذار».`,'requests');n++});save();toast('سُجل '+n+' غائبين وأُشعر أولياء أمورهم');render()},
  planNew(d){const s=U(d.id);const p=makePlan(s,me().id);S.plans.push(p);notify(s.id,'أُعدّت لك خطة دعم لأربعة أسابيع، راجعها في الصفحة الرئيسية','home');notify(s.parentId,'أُعدّت خطة علاجية لـ'+s.name.split(' ')[0]+'، تجدها في الصفحة الرئيسية','home');save();toast('أُنشئت الخطة وأُشعر الطالب وولي الأمر');render()},
  planWeek(d){const p=S.plans.find(x=>x.id===d.id);p.weeks[+d.i].done=!p.weeks[+d.i].done;save();render()},
  planDone(d){const p=S.plans.find(x=>x.id===d.id);p.status='done';const s=U(p.sid);notify(s.parentId,'اكتملت الخطة العلاجية لـ'+s.name.split(' ')[0],'home');save();confetti();render()},
  planDel(d){S.plans=S.plans.filter(x=>x.id!==d.id);save();render()},
  async planAI(d){const p=S.plans.find(x=>x.id===d.id),s=U(p.sid);if(!CAP.sample)return;toast('جارٍ إعداد التوصيات…');
    try{const r=await CAP.sample(`أنت مرشد طلابي وخبير تعليمي. اقترح 5 توصيات عملية ومحددة باللغة العربية لخطة علاجية لطالب في ${cls(s.classId).name}.\nالمعدل العام ${pct(studentAvg(s))}، نسبة الحضور ${pct(attStats(s.id).rate)}.\nالمواد الضعيفة: ${p.subjects.map(x=>subj(x).name+' '+pct(parts(s.id,s.classId,x).pct)).join('، ')}.\nالأهداف: ${p.goals.join('؛ ')}.\nاكتب نقاطًا قصيرة تبدأ كل منها بـ "- " دون مقدمة أو خاتمة.`);p.ai=r.text.trim();save();render()}catch(e){toast(sampleErr(e&&e.code))}},
  qbSet(d){ui.qb[d.k]=d.id;render()},
  qbAdd(){openModal('سؤال جديد في البنك',`<form class="form" data-form="qbAdd"><label class="f">نص السؤال<input type="text" name="q" id="qa-q" required></label>${[0,1,2,3].map(j=>`<div class="qb" style="padding:6px 10px"><div class="row"><input type="radio" name="a" value="${j}" ${j===0?'checked':''} aria-label="الإجابة الصحيحة"><input type="text" name="o${j}" id="qa-o${j}" placeholder="الخيار ${j+1}${j===0?' (حدد الدائرة للإجابة الصحيحة)':''}" ${j<2?'required':''}></div></div>`).join('')}<div class="fgrid"><label class="f">المستوى<select name="level" id="qa-l"><option>سهل</option><option selected>متوسط</option><option>صعب</option></select></label><label class="f">الصف<select name="grade" id="qa-g">${opts(GRADES.map(g=>[g,g]))}</select></label></div><div class="tools"><button class="btn primary">إضافة للبنك</button></div></form>`)},
  qbDel(d){S.qbank=S.qbank.filter(x=>x.id!==d.id);save();render()},

  qbBuild(){const f=ui.qb;openModal('توليد اختبار متوازن – '+subj(f.sub).name,`<form class="form" data-form="qbBuild"><label class="f">عنوان الاختبار<input type="text" name="title" id="qbb-t" value="اختبار قصير – ${esc(subj(f.sub).name)}" required></label><div class="fgrid"><label class="f">الفصل<select name="classId" id="qbb-c">${classOpts()}</select></label><label class="f">عدد الأسئلة<input type="number" name="n" id="qbb-n" min="3" max="20" value="8"></label><label class="f">سهل %<input type="number" name="e" id="qbb-e" min="0" max="100" value="40"></label><label class="f">صعب %<input type="number" name="h" id="qbb-h" min="0" max="100" value="20"></label><label class="f">المدة (دقيقة)<input type="number" name="dur" id="qbb-d" min="3" max="90" value="15"></label><label class="f">متاح حتى<input type="date" name="due" id="qbb-due" value="${addDays(TODAY,5)}"></label></div><p class="note">الباقي من الأسئلة بمستوى متوسط، ويُكمَل أي نقص من المستويات الأخرى.</p><div class="tools"><button class="btn primary">${ic('spark')} توليد ونشر</button></div></form>`)},
  qbAI(){openModal('توليد أسئلة بالذكاء الاصطناعي – '+subj(ui.qb.sub).name,`<form class="form" data-form="qbAI"><label class="f">الموضوع أو عنوان الدرس<input type="text" name="topic" id="qai-topic" required placeholder="مثال: ضرب الأعداد الصحيحة"></label><div class="fgrid"><label class="f">الصف<select name="grade" id="qai-g">${opts(GRADES.map(g=>[g,g]))}</select></label><label class="f">عدد الأسئلة<input type="number" name="n" id="qai-n" min="3" max="15" value="6"></label></div><div id="qaiStatus"></div><div class="tools"><button class="btn primary">${ic('spark')} ولّد وأضف للبنك</button></div></form>`)},
  sendReports(){const wk=addDays(TODAY,-dow(TODAY));S.reportsSent[wk]=Date.now();byRole('parent').forEach(p=>notify(p.id,'التقرير الأسبوعي لأبنائك جاهز، اطّلع عليه ونزّله PDF','report'));save();toast('أُرسلت التقارير إلى '+byRole('parent').length+' من أولياء الأمور');confetti();render()},
  previewReport(d){const s=U(d.id);openModal('التقرير الأسبوعي – '+s.name,`<div style="display:grid;gap:12px"><div class="tools">${pdfBtn('reportDocM','التقرير الأسبوعي – '+s.name)}</div>${reportDoc(s,'reportDocM')}</div>`,'wide')},
  posAdd(d){const p=ui.pos||(ui.pos={sid:'',cart:[]}),it=S.canteen.items.find(i=>i.id===d.id),s=U(p.sid);if(!s){toast('اختر الطالب أولًا');return}const h=S.health[s.id]||{};
    if(it.alg.some(a=>(h.alg||[]).includes(a))){toast('⚠ لا يمكن البيع: الصنف يسبب حساسية مسجلة للطالب');return}

function cinStart(){clearInterval(cinT);cinT=null;if(reduced())return;cinT=setInterval(()=>{if(!cinPaused&&!document.hidden)cinGo(cinI+1)},8000)}

  const roles=[['admin','الإدارة المدرسية','الطلاب والمعلمون والجداول والخدمات الطلابية والرسوم','shield'],['principal','مدير المدرسة','مؤشرات الأداء والتحصيل والزيارات والخطط العلاجية','chart'],['teacher','المعلم','مولّد الدروس والواجبات والاختبارات والتحضير والدرجات','book'],['student','الطالب','الدروس والاختبارات والإنجازات والمكتبة والمحفظة','cap'],['parent','ولي الأمر','التقرير الأسبوعي والحضور والحافلة والصحة والتواصل','users']];
  const feats=[['spark','مولّد دروس وعروض PowerPoint'],['video','فصول افتراضية مباشرة'],['qr','حضور ذكي ببطاقة QR'],['report','تقارير أسبوعية PDF'],['food','مقصف إلكتروني آمن'],['bus','تتبع الحافلة المدرسية']];
  return `<div class="login">${cinemaHtml()}
   <div class="feat-band">${feats.map(([i,t])=>`<div class="feat"><span class="role-ic">${ic(i)}</span>${t}</div>`).join('')}</div>
   <section class="login-main" id="roles">
    <div><h2>اختر نوع الحساب للدخول</h2><p class="note">حسابات تجريبية جاهزة لكل دور. كل ما تضيفه يظهر فورًا في حسابات الأدوار الأخرى.</p></div>
    <div class="login-grid">${roles.map(([r,t,d,i],k)=>`<form class="role-card" data-form="login" style="--i:${k}"><span class="role-ic">${ic(i)}</span><h3>${t}</h3><p>${d}</p>
      <select name="uid" id="login-${r}" aria-label="الحساب">${byRole(r).map(u=>`<option value="${u.id}">${esc(u.name)}${u.role==='parent'?' ('+u.children.length+(u.children.length>1?' أبناء':' ابن')+')':''}</option>`).join('')}</select>
      <button class="btn primary">دخول</button></form>`).join('')}</div>
    <p class="note">نسخة تجريبية: البيانات محفوظة في هذا المتصفح فقط. <button type="button" class="link" data-act="confirm" data-do="resetDemo">إعادة البيانات التجريبية</button></p>
   </section></div>`;
};
const _render4=render;
render=function(){_render4();if(!me()){cinI=0;cinGo(0);cinStart()}else if(cinT){clearInterval(cinT);cinT=null}};
Object.assign(A,{
  cinGo(d){cinGo(+d.i);cinStart()},
  cinToggle(){cinPaused=!cinPaused;const c=document.querySelector('.cin');if(c)c.classList.toggle('paused',cinPaused);const b=document.getElementById('cinBtn');if(b)b.innerHTML=cinPaused?ic('play')+' تشغيل المشاهد':'❚❚ إيقاف المشاهد'},
  toRoles(){const r=document.getElementById('roles');if(r&&r.scrollIntoView)r.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'})},
});

const _tick=tick;tick=function(){_tick();document.querySelectorAll('[data-bus]').forEach(el=>{const b=S.buses.find(x=>x.id===el.dataset.bus);if(!b)return;const P=busPos(b);el.style.right=P.prog*100+'%';const f=el.parentElement&&el.parentElement.querySelector('.rfill');if(f)f.style.width=P.prog*100+'%'})};

render();
</script>
